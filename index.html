<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>밍갱 푸호 도쿄 여행 ✈️</title>
<meta property="og:title" content="밍갱 푸호 도쿄 여행 ✈️"/>
<meta property="og:description" content="2026.09.12 ~ 09.15 · 3박 4일 도쿄"/>
<meta property="og:image" content="og-image.png"/>
<meta property="og:type" content="website"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="theme-color" content="#ff3b5c">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#ff3b5c;--red2:#fff0f3;
  --ink:#18181b;--muted:rgba(24,24,27,.4);--border:rgba(24,24,27,.08);
  --bg:#f4f4f7;--card:#fff;
  --green:#00c27a;--green2:#dcfff1;
  --purple:#7c5cfc;--purple2:#f0eeff;
  --blue:#2d8ef5;--blue2:#e6f2ff;
  --amber:#ff9500;--amber2:#fff5e6;
  --orange:#ff6b35;--orange2:#fff3ee;
  --teal:#00bcd4;--teal2:#e0f9fc;
  --pink:#f72585;--pink2:#fff0f7;
  --nav-h:66px;
}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button,input{font-family:inherit;}

/* ── GATE ── */
.gate{position:fixed;inset:0;z-index:3000;background:linear-gradient(160deg,#ff3b5c,#ff6b8a 55%,#ff9500);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.gate.hide{display:none;}
.gate-em{font-size:52px;margin-bottom:14px;}
.gate-t{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.4px;}
.gate-s{font-size:12px;color:rgba(255,255,255,.8);font-weight:600;margin-bottom:24px;line-height:1.6;}
.gate-in{width:190px;padding:15px;border:none;border-radius:16px;font-size:26px;font-weight:900;text-align:center;letter-spacing:10px;outline:none;color:var(--ink);background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.16);}
.gate-btn{margin-top:14px;width:190px;padding:14px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;cursor:pointer;}
.gate-err{color:#fff;font-size:12px;font-weight:800;margin-top:12px;height:16px;}

/* ── HERO (1단 압축) ── */
.hero{background:#fff;padding:10px 14px 12px;border-bottom:1px solid var(--border);}
.hero-bar{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.hero-mark{font-size:16px;line-height:1;}
.hero-kv{font-size:11.5px;font-weight:900;color:var(--ink);letter-spacing:-.2px;}
.hero-kv em{font-style:normal;color:var(--red);}
.hero-spacer{flex:1;}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:100px;background:var(--bg);color:var(--muted);}
.sync-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);}
.sync-pill.live{background:var(--green2);color:var(--green);}
.sync-pill.live .dot{background:var(--green);}
.hero-msg-row{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 13px;background:linear-gradient(135deg,#ff3b5c,#ff6b8a);transition:background .5s ease;}
.hero-msg-em{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hero-msg-body{min-width:0;}
.hero-msg-day{font-size:8.5px;color:rgba(255,255,255,.62);font-weight:800;letter-spacing:.5px;margin-bottom:2px;}
.hero-msg-main{font-size:12.5px;font-weight:700;color:#fff;line-height:1.5;}

/* ── NOW 배너 (시그니처) ── */
.nowbar{margin:12px 14px 0;border-radius:16px;background:var(--ink);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:13px;}
.nowbar.pre{background:linear-gradient(135deg,#18181b,#3f3f46);}
.now-clock{flex-shrink:0;text-align:center;line-height:1;}
.now-clock .hh{font-size:26px;font-weight:900;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;}
.now-clock .tag{font-size:8.5px;font-weight:900;letter-spacing:1.2px;color:rgba(255,255,255,.5);margin-top:4px;}
.now-div{width:1px;align-self:stretch;background:rgba(255,255,255,.16);flex-shrink:0;}
.now-body{flex:1;min-width:0;}
.now-t{font-size:14px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.now-s{font-size:11px;color:rgba(255,255,255,.62);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.now-go{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;}
.now-dd{font-size:30px;font-weight:900;letter-spacing:-1.6px;font-variant-numeric:tabular-nums;}

/* ── DAY SWITCHER ── */
.day-sw{display:flex;gap:6px;padding:12px 14px 0;background:var(--bg);}
.ds{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all .18s;line-height:1.4;}
.ds small{display:block;font-size:9px;font-weight:700;opacity:.7;}
.ds.on{background:linear-gradient(135deg,var(--red),#ff6b8a);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,59,92,.3);}
.ds.on small{opacity:.85;}

/* ── MAP ── */
#mapWrap{display:block;padding:12px 14px 0;position:relative;}
#map{height:260px;width:100%;border-radius:16px;border:1.5px solid var(--border);background:#eef0f4;}
.map-exp{position:absolute;right:22px;top:20px;z-index:400;width:34px;height:34px;border-radius:11px;border:none;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.16);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.map-hint{font-size:10px;color:var(--muted);font-weight:600;text-align:center;padding:7px 0 0;}
#mapWrap.full{position:fixed;inset:0;z-index:1200;padding:0;background:#fff;}
#mapWrap.full #map{height:100%;border-radius:0;border:none;}
#mapWrap.full .map-hint{display:none;}
#mapWrap.full .map-exp{right:14px;top:max(14px, env(safe-area-inset-top));width:40px;height:40px;font-size:17px;}

/* ── CONTENT ── */
.tab-panel{display:none;padding:14px 14px calc(var(--nav-h) + 20px);}
.tab-panel.on{display:block;}
.sec-title{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.5px;margin:4px 0 4px;}
.sec-sub{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.6;margin-bottom:14px;}

/* ── TIMELINE ── */
.tl-item{display:flex;gap:10px;margin-bottom:6px;}
.tl-g{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.tl-time{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;padding-top:16px;}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--red);background:var(--card);margin-top:4px;z-index:1;flex-shrink:0;}
.tl-line{width:1.5px;flex:1;background:var(--border);min-height:16px;}
.tl-item.now .tl-time{color:var(--red);}
.tl-item.now .tl-dot{background:var(--red);box-shadow:0 0 0 4px rgba(255,59,92,.18);}
.tl-item.past{opacity:.45;}
.pc{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;transition:box-shadow .2s;}
.tl-item.now .pc{border-color:var(--red);box-shadow:0 4px 20px rgba(255,59,92,.14);}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.pc-name{font-size:13px;font-weight:800;color:var(--ink);}
.pc-jp{font-size:10px;color:var(--muted);font-weight:400;margin-left:3px;}
.badge{flex-shrink:0;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:800;white-space:nowrap;color:#fff;}
.b-food{background:linear-gradient(135deg,#ff3b5c,#ff6b8a);}
.b-cafe{background:linear-gradient(135deg,#ff9500,#ffb830);}
.b-shop{background:linear-gradient(135deg,#7c5cfc,#a67cfb);}
.b-sight{background:linear-gradient(135deg,#00c27a,#00e5a0);}
.b-move{background:linear-gradient(135deg,#2d8ef5,#6ab4ff);}
.b-active{background:linear-gradient(135deg,#f72585,#ff6b9d);}
.b-hotel{background:linear-gradient(135deg,#18181b,#4b4b52);}
.b-fun{background:linear-gradient(135deg,#00bcd4,#5ee0ee);}
.pc-desc{font-size:11.5px;color:var(--muted);line-height:1.6;}
.pc-tip{background:linear-gradient(135deg,#fff5f7,#ffe8ee);border-left:3px solid var(--red);padding:8px 11px;border-radius:0 10px 10px 0;font-size:11.5px;line-height:1.65;margin-top:8px;}
.pc-tip strong{color:var(--red);}
.pc-warn{background:linear-gradient(135deg,#fff8e8,#fff0d0);border-left:3px solid var(--amber);padding:8px 11px;border-radius:0 10px 10px 0;font-size:11.5px;line-height:1.65;margin-top:8px;}
.pc-warn strong{color:#c47600;}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.chip{padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700;background:var(--bg);color:var(--muted);}
.pc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.map-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#fff;background:var(--ink);padding:5px 12px;border-radius:100px;text-decoration:none;}
.map-btn.ghost{background:var(--bg);color:var(--ink);}
.map-btn.book{background:linear-gradient(135deg,var(--red),#ff6b8a);}

/* Transit */
.transit{display:flex;align-items:center;gap:8px;margin:3px 0 3px 54px;background:rgba(26,26,46,.04);border-radius:10px;padding:7px 12px;}
.tr-ic{font-size:14px;flex-shrink:0;}
.tr-info{flex:1;font-size:11px;line-height:1.45;}
.tr-mode{font-weight:800;color:var(--ink);}
.tr-time{color:var(--muted);}

/* ── FOOD / CAFE ── */
.meal-section{margin-bottom:20px;}
.meal-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.meal-hd-label{font-size:14px;font-weight:800;color:var(--ink);}
.meal-hd-line{flex:1;height:1.5px;background:var(--border);border-radius:1px;}
.food-opt{position:relative;display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s, box-shadow .15s;overflow:hidden;}
.food-opt.sel{border-color:var(--red);box-shadow:0 4px 18px rgba(255,59,92,.13);}
.food-opt.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--red),#ff9500);}
.fo-em{width:46px;height:46px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;flex-shrink:0;transition:background .15s;}
.food-opt.sel .fo-em{background:var(--red2);}
.fo-info{flex:1;min-width:0;}
.fo-name{font-size:13.5px;font-weight:900;color:var(--ink);letter-spacing:-.2px;margin-bottom:3px;}
.fo-jp{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0;}
.fo-desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:7px;}
.fo-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.fo-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
.fo-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:transparent;transition:all .15s;}
.food-opt.sel .fo-check{background:var(--red);border-color:var(--red);color:#fff;}
.fo-map{font-size:10px;font-weight:800;color:var(--ink);background:var(--bg);padding:5px 10px;border-radius:100px;text-decoration:none;white-space:nowrap;}
.fo-pick{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:var(--red);background:var(--red2);padding:3px 9px;border-radius:100px;}

/* ── CAFE TAB ── */
.geo-bar{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:14px;}
.geo-ic{font-size:20px;flex-shrink:0;}
.geo-txt{flex:1;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.5;}
.geo-btn{flex-shrink:0;padding:7px 13px;border-radius:100px;border:none;background:var(--ink);color:#fff;font-size:11px;font-weight:800;cursor:pointer;}
.cafe-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
.cafe-filter::-webkit-scrollbar{display:none;}
.cf{padding:7px 15px;border-radius:100px;border:1.5px solid var(--border);background:var(--card);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;}
.cf.on{background:linear-gradient(135deg,var(--amber),#ffb830);color:#fff;border-color:transparent;}
.cafe-card{display:flex;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:9px;transition:all .15s;}
.cafe-card.been{opacity:.55;}
.cafe-em{font-size:28px;line-height:1;flex-shrink:0;margin-top:2px;}
.cafe-info{flex:1;min-width:0;}
.cafe-name{font-size:13.5px;font-weight:800;color:var(--ink);}
.cafe-jp{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px;}
.cafe-desc{font-size:11.5px;color:var(--muted);line-height:1.6;margin:4px 0 6px;}
.cafe-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.cafe-dist{background:var(--red2);color:var(--red);padding:3px 9px;border-radius:100px;font-size:10px;font-weight:800;}
.cafe-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;}
.been-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;}
.cafe-card.been .been-btn{background:var(--green);border-color:var(--green);color:#fff;}

/* ── DISNEY ── */
.dz-hero{background:linear-gradient(140deg,#1b3a6b,#2d6fa8 60%,#00bcd4);border-radius:20px;padding:18px 18px 16px;color:#fff;margin-bottom:16px;}
.dz-hero-kv{display:inline-block;background:rgba(255,255,255,.22);font-size:10px;font-weight:800;padding:4px 12px;border-radius:100px;margin-bottom:10px;}
.dz-hero-t{font-size:19px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;}
.dz-hero-s{font-size:12px;line-height:1.65;opacity:.88;font-weight:600;}
.dz-grp{margin-bottom:20px;}
.dz-grp-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.dz-grp-t{font-size:14px;font-weight:900;color:var(--ink);}
.dz-grp-c{font-size:10px;font-weight:800;color:#fff;background:var(--ink);padding:2px 9px;border-radius:100px;}
.dz-grp-line{flex:1;height:1.5px;background:var(--border);}
.dz-item{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:7px;cursor:pointer;user-select:none;transition:all .15s;}
.dz-item.done{opacity:.5;}
.dz-item.done .dz-name{text-decoration:line-through;}
.dz-chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;color:transparent;transition:all .15s;}
.dz-item.done .dz-chk{background:var(--blue);border-color:var(--blue);color:#fff;}
.dz-body{flex:1;min-width:0;}
.dz-name{font-size:13px;font-weight:800;color:var(--ink);line-height:1.35;}
.dz-jp{font-size:10px;color:var(--muted);font-weight:400;margin-left:4px;}
.dz-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.dz-zone{flex-shrink:0;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:100px;background:var(--blue2);color:var(--blue);white-space:nowrap;}

/* ── SHOP ── */
.shop-sec{margin-bottom:24px;}
.shop-cat-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:12px 14px;border-radius:16px;}
.shop-cat-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.6);}
.shop-cat-label{flex:1;}
.shop-cat-title{font-size:15px;font-weight:900;color:var(--ink);}
.shop-cat-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}
.prod-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:8px;cursor:pointer;user-select:none;transition:all .15s;}
.prod-card.done{opacity:.5;}
.prod-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;color:transparent;transition:all .15s;}
.prod-card.done .prod-check{background:var(--green);border-color:var(--green);color:#fff;}
.prod-em{font-size:26px;line-height:1;flex-shrink:0;}
.prod-info{flex:1;min-width:0;}
.prod-name{font-size:13px;font-weight:800;color:var(--ink);line-height:1.3;}
.prod-card.done .prod-name{text-decoration:line-through;}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.prod-arr{font-size:18px;color:var(--muted);flex-shrink:0;line-height:1;}
.shop-add{display:flex;gap:8px;margin-top:8px;}
.shop-add input{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;background:var(--card);color:var(--ink);outline:none;}
.shop-add input:focus{border-color:var(--red);}
.shop-add button{padding:10px 16px;background:var(--red);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:100px;margin:12px auto 0;}
.modal-body{padding:14px 22px 0;}
.modal-em-big{font-size:60px;text-align:center;display:block;margin:8px 0 14px;}
.modal-name{font-size:19px;font-weight:900;color:var(--ink);margin-bottom:2px;}
.modal-jp{font-size:12px;color:var(--muted);margin-bottom:12px;}
.modal-desc{font-size:14px;color:var(--ink);line-height:1.75;margin-bottom:14px;}
.modal-price-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.modal-tag{padding:5px 13px;border-radius:100px;font-size:12px;font-weight:700;}
.modal-tag.price{background:var(--amber2);color:var(--amber);}
.modal-tag.where{background:var(--purple2);color:var(--purple);}
.modal-tip{background:linear-gradient(135deg,#fff5f7,#ffe8ee);border-left:3px solid var(--red);padding:10px 13px;border-radius:0 12px 12px 0;font-size:12px;line-height:1.7;margin-bottom:20px;}
.modal-tip strong{color:var(--red);}
.modal-btns{display:flex;gap:10px;padding:0 22px 28px;}
.modal-btn-close{flex:1;padding:14px;border:1.5px solid var(--border);border-radius:14px;font-size:14px;font-weight:700;background:transparent;color:var(--muted);cursor:pointer;}
.modal-btn-check{flex:1;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--red),#ff6b8a);color:#fff;cursor:pointer;}
.modal-btn-check.checked{background:linear-gradient(135deg,var(--green),#00e5a0);}

/* ── PREP ── */
.prep-msg{border-radius:18px;padding:16px 18px;color:#fff;margin-bottom:18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#ff9500,#ffb830);}
.prep-msg-av{font-size:32px;flex-shrink:0;}
.prep-msg-lbl{font-size:10px;opacity:.65;font-weight:700;letter-spacing:.4px;margin-bottom:4px;}
.prep-msg-txt{font-size:14px;font-weight:700;line-height:1.5;}
.prep-sec{margin-bottom:22px;}
.prep-sec-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.prep-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:6px;cursor:pointer;user-select:none;transition:all .15s;font-size:12.5px;font-weight:600;}
.prep-item.done{opacity:.5;}
.prep-item.done .prep-txt{text-decoration:line-through;}
.prep-txt{flex:1;line-height:1.45;}
.s-box{width:21px;height:21px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;color:transparent;transition:all .15s;}
.prep-item.done .s-box{background:var(--green);border-color:var(--green);color:#fff;}
.who{flex-shrink:0;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:100px;white-space:nowrap;}
.who.both{background:var(--purple2);color:var(--purple);}
.who.one{background:var(--teal2);color:#0097a7;}
.info-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:9px;}
.info-card-title{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.info-row{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);margin-bottom:6px;line-height:1.6;}
.info-row:last-child{margin-bottom:0;}
.info-row b{color:var(--ink);font-weight:800;}
.info-dot{width:5px;height:5px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:6px;}

.empty{text-align:center;padding:28px 14px;font-size:12px;color:var(--muted);font-weight:600;line-height:1.7;}

/* ── PHRASE ── */
.phrase-cats{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;}
.phrase-cats::-webkit-scrollbar{display:none;}
.pcat{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s;}
.pcat.on{color:#fff;border-color:transparent;}
.phrase-list{display:flex;flex-direction:column;gap:10px;}
.phrase-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;}
.phrase-card:active{transform:scale(.98);}
.phrase-kr{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.phrase-jp{font-size:19px;font-weight:900;color:var(--ink);line-height:1.35;margin-bottom:4px;padding-right:44px;}
.phrase-romaji{font-size:11px;color:var(--muted);font-style:italic;}
.phrase-res-hint{font-size:10px;color:var(--muted);font-weight:700;margin-top:6px;}
.pm-sheet{max-height:92vh;}
.pm-header{padding:20px 22px 18px;color:#fff;text-align:center;}
.pm-hint{font-size:11px;opacity:.8;font-weight:700;margin-bottom:14px;background:rgba(255,255,255,.2);display:inline-block;padding:4px 12px;border-radius:100px;}
.pm-jp{font-size:30px;font-weight:900;line-height:1.35;margin-bottom:8px;}
.pm-kr{font-size:14px;opacity:.88;font-weight:700;margin-bottom:4px;}
.pm-romaji{font-size:12px;opacity:.62;font-style:italic;}
.pm-body{padding:18px 18px 0;}
.pm-res-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:12px;text-align:center;}
.pm-res-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.pm-res-btn{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:13px 10px;cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;gap:4px;align-items:center;}
.pm-res-btn:active{transform:scale(.96);}
.pm-res-btn.selected{border-color:var(--green);background:var(--green2);}
.pm-res-jp{font-size:14px;font-weight:900;color:var(--ink);line-height:1.3;}
.pm-res-kr{font-size:10px;color:var(--muted);font-weight:700;}
.pm-res-btn.selected .pm-res-jp{color:var(--green);}
.pm-answer{background:var(--green2);border-left:3px solid var(--green);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px;font-weight:800;color:var(--green);margin-bottom:16px;display:none;text-align:center;}
.copy-toast{position:fixed;bottom:calc(var(--nav-h) + 24px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:100px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;}
.copy-toast.show{opacity:1;}

/* ── NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(10px, env(safe-area-inset-bottom));z-index:500;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 1px;border:none;background:none;transition:opacity .15s;}
.bn-ic{font-size:17px;line-height:1;}
.bn-lbl{font-size:8.5px;font-weight:800;color:var(--muted);}
.bn.on .bn-lbl{color:var(--red);}

/* ── 품질 기준선 ── */
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:6px;}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

@media(max-width:480px){
  #map{height:220px;}
  .now-clock .hh{font-size:23px;}
  .now-dd{font-size:27px;}
  .phrase-jp{font-size:18px;}
  .pm-jp{font-size:26px;}
  .bn-ic{font-size:16px;}
}

   9. 상태 + 동기화

var LS_KEY = 'tokyo2026:'+SUPA.room;
var state = {checks:{}, picks:{}, custom:{}, v:0};
var supa=null, syncing=false;

function loadLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var o=JSON.parse(raw); for(var k in o) state[k]=o[k]; }
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function commit(){
  state.v = (state.v||0)+1;
  saveLocal();
  pushRemote();
}

/* Supabase는 설정돼 있을 때만 불러온다 (오프라인 우선) */
function initSync(){
  if(!SUPA.url || !SUPA.key){ setSync(false,'이 기기에만 저장 중'); return; }
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload=function(){
    try{
      supa = window.supabase.createClient(SUPA.url, SUPA.key);
      pullRemote();
      supa.channel('trip').on('postgres_changes',
        {event:'*',schema:'public',table:'trip_state',filter:'room=eq.'+SUPA.room},
        function(payload){ mergeRemote(payload.new); }).subscribe();
      setSync(true,'둘이 같이 보는 중');
    }catch(e){ setSync(false,'이 기기에만 저장 중'); }
  };
  s.onerror=function(){ setSync(false,'오프라인 · 이 기기에 저장 중'); };
  document.head.appendChild(s);
}
function pullRemote(){
  if(!supa) return;
  supa.from('trip_state').select('*').eq('room',SUPA.room).maybeSingle()
    .then(function(r){ if(r && r.data) mergeRemote(r.data); });
}
function mergeRemote(row){
  if(!row || !row.data) return;
  var d = typeof row.data==='string' ? JSON.parse(row.data) : row.data;
  if((d.v||0) <= (state.v||0)) return;
  for(var k in d) state[k]=d[k];
  saveLocal();
  renderAll();
}
function pushRemote(){
  if(!supa || syncing) return;
  syncing=true;
  supa.from('trip_state').upsert({room:SUPA.room, data:state}, {onConflict:'room'})
    .then(function(){ syncing=false; }, function(){ syncing=false; });
}
function setSync(live,txt){
  var p=document.getElementById('syncPill');
  p.className = 'sync-pill'+(live?' live':'');
  document.getElementById('syncTxt').textContent = txt;
}

function isChecked(k){ return !!state.checks[k]; }
function toggleCheck(k){ if(state.checks[k]) delete state.checks[k]; else state.checks[k]=1; commit(); }

function tryGate(){
  var v=document.getElementById('gateIn').value.trim();
  if(v===GATE_CODE){
    try{ localStorage.setItem(LS_KEY+':ok','1'); }catch(e){}
    document.getElementById('gate').classList.add('hide');
    boot();
  } else {
    document.getElementById('gateErr').textContent='코드가 틀렸어 🥲';
    document.getElementById('gateIn').value='';
  }
}
document.getElementById('gateIn').addEventListener('keydown',function(e){
  if(e.key==='Enter') tryGate();
  if(this.value.length===3 && /[0-9]/.test(e.key)) setTimeout(tryGate,180);
});

   11. 날짜 로직
   ══════════════════════════════════════════ */
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return n<10?'0'+n:''+n; }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function toMin(t){ var a=t.split(':'); return (+a[0])*60+(+a[1]); }
function dayIndexForToday(){
  var t=today();
  for(var i=0;i<TRIP_DATES.length;i++){ if(TRIP_DATES[i]===t) return i; }
  return -1;
}
function daysUntilTrip(){
  var start=new Date(2026,8,12);
  var n=new Date(); n.setHours(0,0,0,0);
  return Math.round((start-n)/86400000);
}

/* ── NOW 배너: 여행 중이면 지금/다음, 아니면 D-day ── */
function renderNow(){
  var el=document.getElementById('nowbar');
  var ti=dayIndexForToday();
  if(ti<0){
    var dd=daysUntilTrip();
    if(dd>0){
      el.className='nowbar pre';
      el.innerHTML='<div class="now-clock"><div class="now-dd">'+dd+'</div><div class="tag">DAYS LEFT</div></div>'
        +'<div class="now-div"></div>'
        +'<div class="now-body"><div class="now-t">도쿄까지 '+dd+'일</div>'
        +'<div class="now-s">준비 탭에서 챙길 것 확인하기</div></div>'
        +'<button class="now-go" onclick="switchTab(\'prep\')" aria-label="준비물 보기">🎒</button>';
    } else {
      el.className='nowbar pre';
      el.innerHTML='<div class="now-clock"><div class="now-dd">🐰</div></div><div class="now-div"></div>'
        +'<div class="now-body"><div class="now-t">다녀왔습니다</div>'
        +'<div class="now-s">다음엔 어디 갈까?</div></div>';
    }
    return;
  }
  var slots=DAYS[ti].slots, nm=nowMin(), cur=null, nxt=null;
  for(var i=0;i<slots.length;i++){
    if(toMin(slots[i].t)<=nm) cur=slots[i];
    else { nxt=slots[i]; break; }
  }
  var s = cur||slots[0];
  el.className='nowbar';
  el.innerHTML='<div class="now-clock"><div class="hh">'+s.t+'</div><div class="tag">'+(cur?'NOW':'SOON')+'</div></div>'
    +'<div class="now-div"></div>'
    +'<div class="now-body"><div class="now-t">'+s.name+'</div>'
    +'<div class="now-s">'+(nxt?'다음 '+nxt.t+' '+nxt.name:'오늘 일정 끝 · 수고했어')+'</div></div>'
    +'<a class="now-go" href="'+dirUrl(s.p)+'" target="_blank" rel="noopener" aria-label="길 안내">🧭</a>';
}

/* ── 일정 ── */
function renderSchedule(){
  var d=DAYS[curDay];
  var isToday = TRIP_DATES[curDay]===today();
  var nm = nowMin();
  var nowIdx = -1;
  if(isToday){
    for(var i=0;i<d.slots.length;i++){ if(toMin(d.slots[i].t)<=nm) nowIdx=i; }
  }
  var h = '<div class="sec-title">'+d.label+' · '+d.theme+'</div>'
        + '<div class="sec-sub">'+d.date.replace(/-/g,'.')+' ('+d.dow+')'
        + (isToday?' · <b style="color:var(--red)">오늘이야!</b>':'')+'</div>';

  d.slots.forEach(function(s,i){
    if(s.tr){
      h += '<div class="transit"><span class="tr-ic">'+s.tr.ic+'</span>'
        + '<div class="tr-info"><div class="tr-mode">'+s.tr.mode+'</div>'
        + '<div class="tr-time">'+s.tr.time+'</div></div></div>';
    }
    var cls = 'tl-item';
    if(isToday && i===nowIdx) cls+=' now';
    else if(isToday && i<nowIdx) cls+=' past';
    var kd = KIND[s.k]||KIND.sight;
    h += '<div class="'+cls+'">'

        + '<div class="dz-meta">'+a.m+'</div></div>'

    });

  }
  h += grp('🎯 꼭 탈 것','must',DISNEY.must);

/* ── 맛집 ── */
function renderFood(){
  var date = TRIP_DATES[curDay];
  var f = FOOD[date]||{};
  var d = DAYS[curDay];
  var h = '<div class="sec-title">🍜 '+d.label+' 맛집</div>'

  var any=false;

    any=true;
    var pk = date+':'+meal;
    var picked = state.picks[pk];
    h += '<div class="meal-section"><div class="meal-hd"><span class="meal-hd-label">'+MEAL_LABEL[meal]+'</span>'
      + '<span class="meal-hd-line"></span>'
      + (picked!==undefined?'<span class="fo-pick">✓ '+f[meal][picked].n+'</span>':'')
      + '</div>';
    f[meal].forEach(function(o,i){
      var sel = picked===i;
      var chips = String(o.m).split('·').map(function(x){ return '<span class="chip">'+x.trim()+'</span>'; }).join('');
      h += '<div class="food-opt'+(sel?' sel':'')+'" onclick="pickFood(\''+pk+'\','+i+')">'
        + '<span class="fo-em">'+o.em+'</span>'
        + '<div class="fo-info"><div class="fo-name">'+o.n+'<span class="fo-jp">'+(o.jp||'')+'</span></div>'
        + '<div class="fo-desc">'+o.d+'</div><div class="fo-meta">'+chips+'</div></div>'
        + '<div class="fo-right"><div class="fo-check">✓</div>'

    });

function pickFood(pk,i){
  if(state.picks[pk]===i) delete state.picks[pk]; else state.picks[pk]=i;

}

/* ── 카페 ── */
var myPos=null, cafeArea='전체';
function askGeo(){
  if(!navigator.geolocation){ document.getElementById('geoTxt').textContent='이 브라우저는 위치를 지원하지 않아'; return; }
  document.getElementById('geoTxt').textContent='위치 찾는 중...';
  navigator.geolocation.getCurrentPosition(function(pos){
    myPos={lat:pos.coords.latitude, lng:pos.coords.longitude};
    document.getElementById('geoIc').textContent='🎯';
    document.getElementById('geoTxt').innerHTML='<b style="color:var(--green)">위치 켜짐</b> · 가까운 순으로 정렬했어';
    document.getElementById('geoBtn').textContent='새로고침';
    renderCafes();
  }, function(){
    document.getElementById('geoTxt').textContent='위치를 못 가져왔어. 동네별로 보여줄게';
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
function distKm(a,b){
  var R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmtDist(km){ return km<1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km'; }

function renderCafes(){
  document.getElementById('cafeFilter').innerHTML = CAFE_AREAS.map(function(a){
    return '<button class="cf'+(a===cafeArea?' on':'')+'" onclick="setCafeArea(\''+a+'\')">'+a+'</button>';
  }).join('');

  var list = CAFES.filter(function(c){ return cafeArea==='전체' || c.area===cafeArea; });
  if(myPos){
    list = list.map(function(c){ return Object.assign({}, c, {_d:distKm(myPos,c)}); })
               .sort(function(a,b){ return a._d-b._d; });
  }
  document.getElementById('cafeList').innerHTML = list.map(function(c){
    var k='cafe:'+c.id;
    return '<div class="cafe-card'+(isChecked(k)?' been':'')+'">'
      + '<span class="cafe-em">'+c.em+'</span>'
      + '<div class="cafe-info"><div class="cafe-name">'+c.n+'<span class="cafe-jp">'+c.jp+'</span></div>'
      + '<div class="cafe-desc">'+c.d+'</div>'
      + '<div class="cafe-meta">'
      +   (c._d!==undefined?'<span class="cafe-dist">'+fmtDist(c._d)+'</span>':'')
      +   '<span class="chip">'+c.area+'</span><span class="chip">'+c.h+'</span><span class="chip">'+c.c+'</span>'
      + '</div></div>'
      + '<div class="cafe-acts">'
      +   '<button class="been-btn" onclick="toggleCheck(\''+k+'\');renderCafes()">✓</button>'
      +   '<a class="fo-map" href="https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng+'&travelmode=walking&hl=ko" target="_blank" rel="noopener">📍</a>'
      + '</div></div>';
  }).join('');
}
function setCafeArea(a){ cafeArea=a; renderCafes(); }

function addShop(cat){

function closePhraseModal(){ document.getElementById('phraseModal').classList.remove('open'); document.body.style.overflow=''; }
function copyPhrase(){
  if(!curPhrase) return;
  var t=curPhrase.jp;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(toast,toast);
  else toast();
}
function toast(){
  var el=document.getElementById('copyToast');
  el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); },1400);
}

/* ══════════════════════════════════════════
   13. 지도
   ══════════════════════════════════════════ */
var map=null, layers=[];
function mkIcon(i){
  return L.divIcon({className:'', html:'<div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#ff6b8a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">'+(i+1)+'</div>', iconSize:[26,26], iconAnchor:[13,13]});
}
function loadMap(){
  if(!map) return;
  layers.forEach(function(l){ map.removeLayer(l); });
  layers=[];
  var pins=DAYS[curDay].pins.map(function(k){ return P[k]; }).filter(Boolean);
  if(!pins.length) return;
  var pts=[];
  pins.forEach(function(p,i){
    var m=L.marker([p.lat,p.lng],{icon:mkIcon(i)}).addTo(map).bindPopup('<b>'+(i+1)+'. '+p.n+'</b>');
    layers.push(m); pts.push([p.lat,p.lng]);
  });
  var line=L.polyline(pts,{color:'#ff3b5c',weight:2.5,opacity:.45,dashArray:'6,6'}).addTo(map);
  layers.push(line);
  map.fitBounds(L.latLngBounds(pts).pad(0.25));
}
function initMap(){
  map=L.map('map',{zoomControl:false, attributionControl:false, scrollWheelZoom:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  loadMap();
}
